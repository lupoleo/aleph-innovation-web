let PLACES=[];
const poiLayer = L.layerGroup().addTo(map);
load('places.json').then(p=>{ PLACES=p; p.forEach(([n,c,x,y])=>{ if(!['Beach','Historic site','Church','Museum','Hospital','Square','Hill','Diving','Government office','Library'].includes(c)) return; L.marker([y,x],{pane:'roads',icon:L.divIcon({className:'',html:'<div class="poi-dot"></div>',iconSize:[0,0]})}).bindTooltip(`<b>${esc(n)}</b><br><span style="opacity:.7">${c}</span>`,{direction:'top',offset:[0,-6]}).addTo(poiLayer); }); });

function zoomClass(){
  const z=map.getZoom(), el=document.getElementById('map');
  [13,14,15,16].forEach(k=>el.classList.toggle('z'+k,z>=k));
  if(bld){ if(z>=14.5 && !map.hasLayer(bld)) bld.addTo(map); if(z<14.5 && map.hasLayer(bld)) bld.remove(); }
}
map.on('zoomend',zoomClass); zoomClass();
map.on('mousemove',e=>{document.getElementById('coords').textContent=`${e.latlng.lat.toFixed(4)}° N, ${e.latlng.lng.toFixed(4)}° E`;});

// ---- risks ----
const sevOf = p => p>=100?'crit':p>=60?'high':p>=40?'med':'low';
const sevVar = s => ({crit:'--crit',high:'--high',med:'--med',low:'--low'})[s];
const DOMAINS = [
  {id:'all',name:'All risks'},
  {id:'Water cycle',name:'Water cycle'},
  {id:'Coast',name:'Coast & marine'},
  {id:'Climate',name:'Heat & floods'},
  {id:'Air',name:'Air & noise'},
  {id:'Land',name:'Development'},
  {id:'Community',name:'Community'}
];
const domainOf = r => r.domain==='Marine'?'Coast':r.domain;
let activeDomain='all', showSensors=false, selKey=null;
const riskLayer = L.layerGroup().addTo(map);
const zoneLayer = L.layerGroup().addTo(map);
const markers = [];
RISKS.forEach(r=>{
  r.sev = sevOf(r.L*r.I*r.M); r.P = r.L*r.I*r.M;
  r.sites.forEach((s,i)=>{
    const key=r.id+'-'+i;
    const icon = () => L.divIcon({className:'',html:`<div class="pin${selKey===key?' sel':''}" style="--c:var(${sevVar(r.sev)})"><div class="h"></div><span>${r.id}</span></div>`,iconSize:[0,0]});
    const m = L.marker([s.lat,s.lon],{pane:'risk',icon:icon(),keyboard:true,title:`${r.id} ${r.name}: ${s.name}`,riseOnHover:true});
    m.bindTooltip(`<b>${esc(s.name)}</b><br>${r.id} · ${esc(r.name)}`,{direction:'top',offset:[0,-30]});
    m.on('click',()=>openSite(r,s,key));
    markers.push({r,s,key,m,icon});
    if(s.radius){ const z=L.circle([s.lat,s.lon],{radius:s.radius,pane:'water',renderer:R.water,interactive:false}); z._risk=r; zoneLayer.addLayer(z); }
  });
});
function styleZones(){ zoneLayer.eachLayer(z=>{const r=z._risk; const c=css(sevVar(r.sev)); const vis = activeDomain==='all'||domainOf(r)===activeDomain; z.setStyle({color:c,weight:1.5,dashArray:'5 5',fillColor:c,fillOpacity:vis?.10:0,opacity:vis?.8:0});}); }
styleFns.push(styleZones);
function refreshRisks(){
  riskLayer.clearLayers();
  markers.forEach(o=>{ if(activeDomain==='all'||domainOf(o.r)===activeDomain){ o.m.setIcon(o.icon()); riskLayer.addLayer(o.m);} });
  styleZones();
}
// sensors
const sensorLayer = L.layerGroup();
SENSORS.forEach(s=>{
  const m=L.marker([s.lat,s.lon],{pane:'risk',icon:L.divIcon({className:'',html:`<div class="sens${s.type==='LoRaWAN gateway'?' gw':''}"></div>`,iconSize:[0,0]}),title:s.type+': '+s.site});
  m.bindTooltip(`<b>${esc(s.type)}</b><br>${esc(s.site)} · Phase ${s.phase}`,{direction:'top',offset:[0,-10]});
  m.on('click',()=>openSensor(s));
  sensorLayer.addLayer(m);
});

// ---- chips ----
const chipsEl=document.getElementById('chips');
DOMAINS.forEach(d=>{
  const b=document.createElement('button'); b.className='chip'; b.textContent=d.name; b.dataset.d=d.id; b.setAttribute('aria-pressed',d.id==='all');
  b.onclick=()=>{ activeDomain=d.id; chipsEl.querySelectorAll('[data-d]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.d===d.id)); refreshRisks(); if(view==='overview') renderOverview(); };
  chipsEl.appendChild(b);
});
const sb=document.createElement('button'); sb.className='chip'; sb.innerHTML='<span class="dot" style="background:var(--sensor);border-radius:2px;transform:rotate(45deg)"></span>Planned sensors'; sb.setAttribute('aria-pressed','false');
sb.onclick=()=>{showSensors=!showSensors; sb.setAttribute('aria-pressed',showSensors); showSensors?sensorLayer.addTo(map):sensorLayer.remove(); if(showSensors&&view==='overview') renderSensorsList();};
chipsEl.appendChild(sb);
const simb=document.createElement('button'); simb.className='chip sim'; simb.innerHTML='<span class="dot" style="background:var(--sim)"></span>Storm event demo'; simb.setAttribute('aria-pressed','false');
simb.onclick=()=>{ if(simb.getAttribute('aria-pressed')==='true'){ stopSim(); renderOverview(); } else startSim(); };
chipsEl.appendChild(simb);

// ---- panel ----
const panel=document.getElementById('panel'), pbody=document.getElementById('pbody'), ptitle=document.getElementById('ptitle'), back=document.getElementById('back');
let view='overview';
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);}
function setPanel(title,html,isDetail){ ptitle.textContent=title; pbody.innerHTML=html; back.hidden=!isDetail; pbody.scrollTop=0; if(isDetail||!startCollapsed) expand(true); else { startCollapsed=false; expand(false); fit(); } }
function expand(on){ panel.classList.toggle('collapsed',!on); const c=document.getElementById('collapse'); c.setAttribute('aria-expanded',on); c.setAttribute('aria-label',on?'Collapse panel':'Expand panel'); c.innerHTML= on?'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 15l6-6 6 6"/></svg>':'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>'; }
document.getElementById('collapse').onclick=()=>expand(panel.classList.contains('collapsed'));
back.onclick=()=>{ selKey=null; refreshRisks(); renderOverview(); };
function renderOverview(){
  view='overview';
  const list = RISKS.slice().sort((a,b)=>b.P-a.P).filter(r=>activeDomain==='all'||domainOf(r)===activeDomain);
  setPanel('Gozo risk overview',`
    <div class="kicker">Agentic Environmental Monitoring · Gozo pilot</div>
    <p class="lead">Fourteen environmental and community risks, ranked by priority (likelihood × impact × monitorability, each scored 1–5). Pins mark where each risk concentrates. Select a risk to see its evidence, indicators and planned sensors.</p>
    <div class="risk-list">${list.map(r=>`<button class="risk-row" data-r="${r.id}"><span class="rid">${r.id}</span><span><b>${esc(r.name)}</b><small>${esc(r.domainLabel)} · ${r.sites.length} site${r.sites.length>1?'s':''}${r.mvp==='Yes'?' · MVP':''}</small></span><span class="score sev-${r.sev}">${r.P}</span></button>`).join('')}</div>
    <p class="note">Scores are a first expert estimate from public sources (October 2026), to be re-scored with ERA, the Water Services Corporation and local councils. Sensor sites are proposals, not installations.</p>`,false);
  pbody.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>openRisk(RISKS.find(r=>r.id===b.dataset.r)));
}
function meters(r){ return `<div class="meters">${[['Likelihood',r.L],['Impact',r.I],['Monitorability',r.M]].map(([k,v])=>`<div class="meter"><div class="kicker">${k}</div><div class="v">${v}<span class="muted" style="font-size:12px">/5</span></div><div class="bar"><i style="width:${v*20}%"></i></div></div>`).join('')}</div>`; }
function riskBody(r){
  return `${meters(r)}
   <div><div class="kicker">What is happening</div><ul class="facts">${r.facts.map(f=>`<li>${f}</li>`).join('')}</ul></div>
   <div><div class="kicker">What the system measures</div><div class="tags" style="margin-top:6px">${r.indicators.map(i=>`<span class="tag">${esc(i)}</span>`).join('')}</div></div>
   <div><div class="kicker">Planned sensing</div><div class="tags" style="margin-top:6px">${r.sensors.length?r.sensors.map(i=>`<span class="tag sensor">${esc(i)}</span>`).join(''):'<span class="muted">Public data and satellite only</span>'}</div></div>
   <div class="src"><div class="kicker">Sources</div><ul class="facts">${r.sources.map(s=>`<li><a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])}</a></li>`).join('')}</ul></div>`;
}
function openRisk(r){
  view='risk'; selKey=null;
  if(activeDomain!=='all'&&domainOf(r)!==activeDomain){ activeDomain='all'; chipsEl.querySelectorAll('[data-d]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.d==='all')); }
  refreshRisks();
  setPanel(`${r.id} · ${r.name}`,`<div class="kicker">${esc(r.domainLabel)} · Priority <span class="score sev-${r.sev}">${r.P}</span> · ${r.mvp==='Yes'?'MVP scope':r.mvp}</div>
   <div><div class="kicker">Sites on the map</div><div class="tags" style="margin-top:6px">${r.sites.map((s,i)=>`<button class="tag" style="border:0;cursor:pointer" data-s="${i}">${esc(s.name)}</button>`).join('')}</div></div>
   ${riskBody(r)}`,true);
  pbody.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const i=+b.dataset.s; openSite(r,r.sites[i],r.id+'-'+i);});
  const b=L.latLngBounds(r.sites.map(s=>[s.lat,s.lon]));
  if(r.sites.length===1) map.flyTo(b.getCenter(),Math.max(map.getZoom(),14),{duration:.8}); else map.flyToBounds(b.pad(.3),{maxZoom:15,duration:.8,...padOpts()});
}
function openSite(r,s,key){
  view='site'; selKey=key; refreshRisks();
  setPanel(s.name,`<div class="kicker">${r.id} · ${esc(r.name)} · Priority <span class="score sev-${r.sev}">${r.P}</span></div>
   ${s.note?`<p class="lead">${s.note}</p>`:''}
   <div class="btnrow"><button class="btn ghost" id="allsites">All ${r.sites.length} site${r.sites.length>1?'s':''} for ${r.id}</button></div>
   ${riskBody(r)}
   <p class="note">${s.lat.toFixed(4)}° N, ${s.lon.toFixed(4)}° E${s.approx?' · approximate location':''}</p>`,true);
  document.getElementById('allsites').onclick=()=>openRisk(r);
  map.flyTo([s.lat,s.lon],Math.max(map.getZoom(),15.5),{duration:.8});
}
function openSensor(s){
  view='sensor';
  setPanel(s.type,`<div class="kicker">Planned sensor · Phase ${s.phase}</div>
   <p class="lead"><b>${esc(s.site)}</b></p>
   <div><div class="kicker">Measures</div><p class="lead">${esc(s.measures)}</p></div>
   <div><div class="kicker">Risks covered</div><div class="tags" style="margin-top:6px">${s.risks.map(id=>{const r=RISKS.find(x=>x.id===id);return `<button class="tag" style="border:0;cursor:pointer" data-r="${id}">${id} · ${esc(r.name)}</button>`;}).join('')}</div></div>
   <p class="note">Proposed site, to be agreed with the asset owner and the local council. ${s.lat.toFixed(4)}° N, ${s.lon.toFixed(4)}° E</p>`,true);
  pbody.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>openRisk(RISKS.find(r=>r.id===b.dataset.r)));
  map.flyTo([s.lat,s.lon],Math.max(map.getZoom(),15.5),{duration:.8});
}
function renderSensorsList(){
  const by={}; SENSORS.forEach(s=>{(by[s.type]=by[s.type]||[]).push(s);});
  view='sensors';
  setPanel('Planned sensor network',`<p class="lead">${SENSORS.length} devices on a LoRaWAN network. Phase 1 covers sewage, bathing water and floods; Phase 2 adds air quality and beach occupancy.</p>
  <div class="risk-list">${Object.entries(by).map(([t,a])=>`<div class="risk-row" style="cursor:default"><span class="rid">${a.length}×</span><span><b>${esc(t)}</b><small>${esc(a[0].measures)}</small></span><span class="tag">Phase ${a[0].phase}</span></div>`).join('')}</div>`,true);
}
renderOverview();

// ---- search ----
const q=document.getElementById('q'), res=document.getElementById('results'), qc=document.getElementById('qclear');
const norm = s => s.toLowerCase().replace(/għ/g,'gh').replace(/ħ/g,'h').replace(/ż/g,'z').replace(/ċ/g,'c').replace(/ġ/g,'g').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’']/g,'');
let hits=[], hi=-1;
function search(){
  const t=norm(q.value.trim()); qc.hidden=!q.value;
  if(t.length<2){res.hidden=true;return;}
  const out=[];
  RISKS.forEach(r=>{ if(norm(r.id+' '+r.name+' '+r.domainLabel+' '+r.indicators.join(' ')).includes(t)) out.push({k:'risk',r,label:`${r.id} · ${r.name}`,sub:'Risk · priority '+r.P,ic:r.id}); r.sites.forEach((s,i)=>{ if(norm(s.name).includes(t)) out.push({k:'site',r,s,i,label:s.name,sub:`${r.id} · ${r.name}`,ic:'●'}); }); });
  TOWNS.forEach(x=>{ if(norm(x.en+' '+(x.mt||'')).includes(t)) out.push({k:'town',x,label:x.en,sub:(x.mt&&x.mt!==x.en?x.mt+' · ':'')+'Locality',ic:'⌂'}); });
  SENSORS.forEach(s=>{ if(norm(s.type+' '+s.site).includes(t)) out.push({k:'sensor',s,label:s.type,sub:s.site+' · planned',ic:'◆'}); });
  PLACES.forEach(([n,c,x,y])=>{ if(out.length<40 && norm(n+' '+c).includes(t)) out.push({k:'place',n,c,x,y,label:n,sub:c,ic:'•'}); });
  hits=out.slice(0,12); hi=-1;
  res.innerHTML = hits.length? hits.map((h,i)=>`<button class="res" role="option" data-i="${i}"><span class="ic">${esc(h.ic)}</span><span><b>${esc(h.label)}</b><small>${esc(h.sub)}</small></span></button>`).join('') : '<div class="res muted" style="cursor:default">No matches in Gozo. Try a village, beach or risk such as "sewage".</div>';
  res.hidden=false;
  res.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>pick(hits[+b.dataset.i]));
}
let tmpMarker=null;
function pick(h){
  res.hidden=true; q.value=h.label; qc.hidden=false;
  if(tmpMarker){tmpMarker.remove();tmpMarker=null;}
  if(h.k==='risk') openRisk(h.r);
  else if(h.k==='site') openSite(h.r,h.s,h.r.id+'-'+h.i);
  else if(h.k==='sensor'){ if(!showSensors) sb.click(); openSensor(h.s); }
  else if(h.k==='town'){ map.flyTo([h.x.lat,h.x.lon],15,{duration:.8}); }
  else { map.flyTo([h.y,h.x],17,{duration:.8}); tmpMarker=L.marker([h.y,h.x],{pane:'risk',icon:L.divIcon({className:'',html:'<div class="pin" style="--c:var(--accent)"><div class="h"></div><span>•</span></div>',iconSize:[0,0]})}).bindTooltip(`<b>${esc(h.n)}</b><br>${esc(h.c)}`,{direction:'top',offset:[0,-30],permanent:true}).addTo(map); }
}
q.addEventListener('input',search);
q.addEventListener('keydown',e=>{
  const bs=[...res.querySelectorAll('[data-i]')]; if(!bs.length) return;
  if(e.key==='ArrowDown'){hi=Math.min(bs.length-1,hi+1);e.preventDefault();}
  else if(e.key==='ArrowUp'){hi=Math.max(0,hi-1);e.preventDefault();}
  else if(e.key==='Enter'){pick(hits[Math.max(0,hi)]);e.preventDefault();return;}
  else if(e.key==='Escape'){res.hidden=true;return;}
  bs.forEach((b,i)=>b.classList.toggle('on',i===hi));
});
qc.onclick=()=>{q.value='';qc.hidden=true;res.hidden=true;if(tmpMarker){tmpMarker.remove();tmpMarker=null;}q.focus();};
document.addEventListener('click',e=>{ if(!e.target.closest('.search')) res.hidden=true; });

// ---- controls ----
document.getElementById('zin').onclick=()=>map.zoomIn(1);
document.getElementById('zout').onclick=()=>map.zoomOut(1);
document.getElementById('home').onclick=fit;

// ---- simulated storm event ----
let simLayer=null, simTimer=null, simStep=-1;
function stopSim(){ clearInterval(simTimer); simTimer=null; if(simLayer){simLayer.remove();simLayer=null;} simb.setAttribute('aria-pressed','false'); }
function startSim(){
  stopSim(); simb.setAttribute('aria-pressed','true'); simLayer=L.layerGroup().addTo(map); simStep=-1; view='sim';
  map.flyToBounds([[36.012,14.23],[36.05,14.30]],{duration:.8,...padOpts()});
  renderSim(); simTimer=setInterval(()=>{ if(simStep<SIM.length-1){simStep++;renderSim();} else {clearInterval(simTimer);} },2600);
  simStep=0; renderSim();
}
function renderSim(){
  if(!simLayer) return;
  simLayer.clearLayers();
  SIM.forEach((s,i)=>{ if(i<=simStep && s.lat) L.marker([s.lat,s.lon],{pane:'risk',interactive:false,icon:L.divIcon({className:'',html:i===simStep?'<div class="pulse"></div>':'<div class="pulse" style="animation:none;opacity:.55;width:14px;height:14px"></div>',iconSize:[0,0]})}).addTo(simLayer); });
  setPanel('Storm event demo',`<div class="simbox"><div class="kicker">Simulated example · not real data</div>
   <p class="lead" style="margin-top:6px">How the system handles a heavy-rain night: deterministic checks first, an agent assembles evidence, a person decides.</p>
   <ol class="steps">${SIM.map((s,i)=>`<li class="${i<simStep?'done':i===simStep?'now':''}"><time>${s.t}</time><span><b>${esc(s.title)}</b><br><span class="muted">${esc(s.body)}</span></span></li>`).join('')}</ol></div>
   <div class="btnrow"><button class="btn" id="simReplay">Replay</button><button class="btn ghost" id="simEnd">End demo</button></div>`,true);
  document.getElementById('simReplay').onclick=startSim;
  document.getElementById('simEnd').onclick=()=>{stopSim();renderOverview();};
}

// theme changes
const mq=matchMedia('(prefers-color-scheme: dark)'); mq.addEventListener?.('change',restyle);
new MutationObserver(restyle).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
refreshRisks();
})();
</script>
